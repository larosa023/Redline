name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Redline.sln
      - name: Build
        run: dotnet build Redline.sln -c Release --no-restore
      - name: Test
        run: dotnet test Redline.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test cross-platform projects
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/*/*.csproj; do
            if grep -q -- "-windows" "$p"; then echo "skip (windows-only) $p"; continue; fi
            echo "::group::$p"
            dotnet test "$p" -c Release --logger trx --results-directory TestResults
            echo "::endgroup::"
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
