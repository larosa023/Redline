name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Redline.sln
      - name: Build
        run: dotnet build Redline.sln -c Release --no-restore
      - name: Test
        run: dotnet test Redline.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Smoke test - launch the real app (demo mode)
        shell: pwsh
        run: |
          dotnet publish src/Redline.App/Redline.App.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -o smoke
          dotnet publish src/Redline.Helper/Redline.Helper.csproj -c Release -r win-x64 --self-contained -o smoke/helper
          Get-ChildItem smoke -Filter *.pri | ForEach-Object { Write-Host "PRI: $($_.Name) $($_.Length)" }
          Get-ChildItem smoke -Recurse -Include *.xbf,*.xaml | Select-Object -First 20 | ForEach-Object { Write-Host "XAML: $($_.FullName)" }
          $env:REDLINE_SMOKE = "1"
          $p = Start-Process -FilePath smoke/Redline.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          Write-Host "App alive after 25s: $alive"
          $logs = Join-Path $env:LOCALAPPDATA "Redline\logs"
          if (Test-Path $logs) { Get-ChildItem $logs | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime','Application Error','Windows Error Reporting' } |
            ForEach-Object { Write-Host "== EVENT $($_.ProviderName) $($_.Id)"; Write-Host $_.Message }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Process Redline.Helper -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { throw "Redline.exe exited during startup (exit code $($p.ExitCode))" }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test cross-platform projects
        shell: bash
        run: |
          set -euo pipefail
          for p in tests/*/*.csproj; do
            if grep -q -- "-windows" "$p"; then echo "skip (windows-only) $p"; continue; fi
            echo "::group::$p"
            dotnet test "$p" -c Release --logger trx --results-directory TestResults
            echo "::endgroup::"
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
